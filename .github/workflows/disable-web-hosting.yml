name: Disable retired web app hosting
on: workflow_dispatch
jobs:
  disable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Disable Firebase Hosting for yeah-buddy-app
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_YEAH_BUDDY_APP }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@14 hosting:disable --project yeah-buddy-app --force
